apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: complaint-agent
  tag: v1
  labels:
    owner: support
spec:
  title: Complaint Agent
  description: Handles complaints, escalations and service failures.
  modelProvider: openai
  modelName: gpt-4.1
  # Required whenever an agent composes instructions, skills or plugins: the registry
  # delivers that content to a harness rather than to a plain declarative runtime.
  compatibleHarnesses:
    - type: openclaw
  instructions:
    kind: Prompt
    name: complaint-agent
    tag: v1
  skills:
    - kind: Skill
      name: warranty-triage
      tag: v1
  mcpServers:
    - kind: MCPServer
      name: cloudcart-customers
      tag: v1
    - kind: MCPServer
      name: cloudcart-notifications
      tag: v1
  # The kagent adapter refuses a deployment without an image: "image must be specified for
  # kagent agent deployment". This is the harness that runs the composed content above --
  # it is kagent's own agent image (IMAGE_REPOSITORY/IMAGE_TAG in the kagent-controller
  # config), not anything built from this repo. Skills are delivered into it by kagent's
  # skills-init container. Bump this when kagent is upgraded.
  source:
    image: ghcr.io/kagent-dev/kagent/app:0.10.0-beta10
