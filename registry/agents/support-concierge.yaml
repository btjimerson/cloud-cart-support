apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: support-concierge
  tag: v1
  labels:
    owner: support
spec:
  title: Support Concierge
  description: Customer-facing orchestrator. Delegates to specialists over A2A.
  modelProvider: openai
  modelName: gpt-4.1
  # Required whenever an agent composes instructions, skills or plugins: the registry
  # delivers that content to a harness rather than to a plain declarative runtime.
  compatibleHarnesses:
    - type: openclaw
  instructions:
    kind: Prompt
    name: support-concierge
    tag: v1
  # No skills and no MCP servers: the concierge delegates, it does not act. What it may
  # reach is granted in registry/policies/ against its deployment, not listed here.
  # The harness that runs the composed content above. Neither runtime adapter deploys a
  # composition on its own, so this image resolves this agent's prompt, skills and model
  # from the catalog at startup. It is built once by the platform team (harness/) and is
  # identical for every agent -- nothing agent-specific is baked into it.
  source:
    image: ghcr.io/btjimerson/cloud-cart-support/agent-harness:latest
