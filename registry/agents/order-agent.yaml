apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: order-agent
  tag: v1
  labels:
    owner: support
spec:
  title: Order Agent
  description: Handles order status, tracking, cancellation and shipping.
  modelProvider: openai
  modelName: gpt-4.1
  # Required whenever an agent composes instructions, skills or plugins: the registry
  # delivers that content to a harness rather than to a plain declarative runtime.
  compatibleHarnesses:
    - type: openclaw
  instructions:
    kind: Prompt
    name: order-agent
    tag: v1
  skills:
    - kind: Skill
      name: shipping-exceptions
      tag: v1
  mcpServers:
    - kind: MCPServer
      name: cloudcart-orders
      tag: v1
  # The harness that runs the composed content above. Neither runtime adapter deploys a
  # composition on its own, so this image resolves this agent's prompt, skills and model
  # from the catalog at startup. It is built once by the platform team (harness/) and is
  # identical for every agent -- nothing agent-specific is baked into it.
  # Pinned to an immutable tag rather than :latest. The kagent adapter does not set
  # imagePullPolicy: Always, so a moving tag silently keeps whatever the node already cached --
  # a harness change appears to deploy while the old code keeps running. Bump on harness change.
  source:
    image: ghcr.io/btjimerson/cloud-cart-support/agent-harness:91949dd
