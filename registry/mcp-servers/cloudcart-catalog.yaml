apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: cloudcart-catalog
  tag: v1
  labels:
    owner: merchandising
    domain: catalog
spec:
  title: Cloud Cart Catalog
  description: Product search, details, availability and recommendations. Read-only.
  remote:
    # Through the gateway, not straight to the service: this is what makes tool calls
    # governable at all. The per-server route keeps this agent's toolset scoped to this
    # server and its tool names unprefixed.
    type: streamable-http
    url: http://agentgateway-proxy.agentgateway-system.svc:8080/cloudcart/mcp/catalog
