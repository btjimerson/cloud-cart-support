apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: cloudcart-customers
  tag: v1
  labels:
    owner: customer-data
    domain: customers
spec:
  title: Cloud Cart Customers
  description: Customer profile, loyalty points, interaction notes and store credit. Contains state-changing tools.
  remote:
    # Through the gateway, not straight to the service: this is what makes tool calls
    # governable at all. The per-server route keeps this agent's toolset scoped to this
    # server and its tool names unprefixed.
    type: streamable-http
    url: http://agentgateway-proxy.agentgateway-system.svc:8080/cloudcart/mcp/customers
