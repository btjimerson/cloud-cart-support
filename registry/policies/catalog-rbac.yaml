# Registry RBAC: who may publish, approve and deploy catalog artifacts.
#
# This is a different layer from dev-runtime-access.yaml. That file governs traffic between
# running things; this one governs who may change the catalog itself:
#
#   AccessPolicy         -> principals + actions on catalog resources   (this file)
#   RuntimeAccessPolicy  -> from/to between deployments and MCP servers (the other file)
#
# Grammar, recovered from the API by submitting invalid values:
#   actions   "<scope>:<verb>" or "*"
#             scope   registry | runtime
#             verbs   registry: read publish edit deploy delete admin | *
#                     runtime:  invoke | *
#   resources kind is lower-case and one of:
#             server agent skill prompt plugin model runtime secret
#             (note `server`, not `MCPServer` -- the catalog kind name differs from the
#             manifest kind name)
#
# Principals are `Role` (an OIDC group, matched via RBAC_ROLE_CLAIM=Groups against Keycloak)
# or `Deployment`. The two demo personas are Keycloak users in different groups, created by
# registry/keycloak-setup.sh.
apiVersion: ar.dev/v1alpha1
kind: AccessPolicy
metadata:
  name: support-engineers
spec:
  description: >-
    Support engineers compose and publish agents. They deliberately lack deploy, delete and
    admin: the engineer cannot ship their own work or grant themselves a tool.
  principals:
    - kind: Role
      name: support-engineers
  rules:
    - actions:
        - registry:read
        - registry:publish
        - registry:edit
      resources:
        - kind: agent
          name: "*"
        - kind: prompt
          name: "*"
        - kind: server
          name: "*"
    # Skills belong to the policy team. Engineers consume them; they do not edit them.
    - actions:
        - registry:read
      resources:
        - kind: skill
          name: "*"
        - kind: model
          name: "*"
        - kind: runtime
          name: "*"
---
apiVersion: ar.dev/v1alpha1
kind: AccessPolicy
metadata:
  name: platform-approvers
spec:
  description: >-
    Approvers own policy, deployment and the approval gate. This is the authority the
    engineer has to ask for at 11:00 -- the grant is not theirs to give themselves.
  principals:
    - kind: Role
      name: platform-approvers
  rules:
    - actions:
        - registry:*
      resources:
        - kind: agent
          name: "*"
        - kind: prompt
          name: "*"
        - kind: skill
          name: "*"
        - kind: server
          name: "*"
        - kind: model
          name: "*"
        - kind: runtime
          name: "*"
        - kind: secret
          name: "*"
---
apiVersion: ar.dev/v1alpha1
kind: AccessPolicy
metadata:
  name: support-ui-invoke
spec:
  description: >-
    The chat frontend's service account. It invokes agents and reads the catalog to render
    what is in play; it can publish nothing. Least privilege for the one identity that is
    reachable from outside the cluster.
  principals:
    - kind: Role
      name: support-ui
  rules:
    # runtime:invoke does not accept a wildcard name -- invocation must name a concrete
    # agent. That suits the frontend exactly: it only ever calls the concierge, and reaching
    # a specialist directly is the concierge's job, governed in dev-runtime-access.yaml.
    - actions:
        - runtime:invoke
      resources:
        - kind: agent
          name: support-concierge
    - actions:
        - registry:read
      resources:
        - kind: agent
          name: "*"
        - kind: server
          name: "*"
        - kind: skill
          name: "*"
