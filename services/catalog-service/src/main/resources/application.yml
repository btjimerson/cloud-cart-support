server:
  port: 8080

spring:
  application:
    name: catalog-service
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
  ai:
    mcp:
      server:
        # Streamable HTTP rather than SSE: agentgateway's MCP federation backend speaks
        # streamable HTTP to /mcp, and routing through the gateway is what makes tool-level
        # policy enforceable at all. SSE bypassed it.
        protocol: STREAMABLE
        capabilities:
          tool: true
        name: catalog-service
        version: 0.1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
