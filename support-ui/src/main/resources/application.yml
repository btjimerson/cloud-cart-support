server:
  port: 8080

spring:
  thymeleaf:
    cache: false

# ---------------------------------------------------------------------------------------
# TODO: point this app at an agent.
#
# Nothing here is known yet. The catalog is the source of truth for what exists, so these
# values are read out of agentregistry rather than invented:
#
#   base-url         where the registry lives
#   default-runtime  which runtime the agent is deployed to  (Runtimes view)
#   concierge-agent  which agent this app should talk to     (Catalog -> Agents)
#
# Find them in the registry UI, or ask the catalog from your editor:
#   ./demo/mcp-config.sh   then: "what agents are published in the registry?"
#
# The credentials come from .env.local via k8s/create-support-ui-secret.sh; this app mints
# its own short-lived tokens and holds no API keys.
# ---------------------------------------------------------------------------------------
agentregistry:
  base-url: ${AGENTREGISTRY_URL:}
  default-runtime: ${AGENTREGISTRY_RUNTIME:}
  concierge-agent: ${CONCIERGE_AGENT:}
  auth-token: ${AGENTREGISTRY_TOKEN:}
  oidc:
    issuer: ${OIDC_ISSUER:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
  timeout-seconds: ${AGENTREGISTRY_TIMEOUT_SECONDS:180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
