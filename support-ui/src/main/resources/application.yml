server:
  port: 8080

spring:
  thymeleaf:
    cache: false

# Where agents live. This service does not know what agents exist, what models they use,
# or what tools they may call -- it asks the catalog and the gateway decides the rest.
agentregistry:
  base-url: ${AGENTREGISTRY_URL:http://localhost:12121}
  default-runtime: ${AGENTREGISTRY_RUNTIME:kagent}
  concierge-agent: ${CONCIERGE_AGENT:support-concierge}
  auth-token: ${AGENTREGISTRY_TOKEN:}
  # Preferred over a static token: registry tokens are short-lived, so the frontend mints
  # its own with the client-credentials grant and refreshes before expiry.
  oidc:
    issuer: ${OIDC_ISSUER:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
  timeout-seconds: ${AGENTREGISTRY_TIMEOUT_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
