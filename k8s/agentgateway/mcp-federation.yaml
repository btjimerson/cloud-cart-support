# Puts agentgateway in front of the MCP servers.
#
# Without this there is no enforcement point: agents receive MCP URLs from the kagent adapter
# and connect straight to the services, so a tool policy has nothing to act on.
#
# Two shapes are defined, deliberately:
#
#   /cloudcart/mcp            all four servers behind one endpoint. This is the federation
#                             demo -- one address, one session, every tool -- and what a
#                             developer or IDE would point at to explore the estate.
#
#   /cloudcart/mcp/<server>   one route per server, `prefixMode: Never`. This is what the
#                             agents use. Federating everything to every agent would hand
#                             returns-agent the notification and catalog tools too, growing
#                             its toolset from 7 to 19 and inviting the model to reach for
#                             things it has no business calling. Per-server routes keep the
#                             scoping the agent artifacts already express, while still putting
#                             the gateway in the path of every call.
#
# Three things the gateway needs from the services, each of which fails differently:
#   appProtocol: agentgateway.dev/mcp on the port -> otherwise "mcp: no backends configured"
#   a URLRewrite stripping the route prefix        -> otherwise the backend answers 404
#   streamable HTTP rather than SSE                -> what the federation backend speaks

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: cloudcart-mcp
  namespace: agentgateway-system
spec:
  mcp:
    targets:
      - name: cloudcart-catalog
        selector:
          namespaces:
            matchLabels:
              kubernetes.io/metadata.name: agentic-demo
          services:
            matchLabels:
              app: catalog-service
      - name: cloudcart-orders
        selector:
          namespaces:
            matchLabels:
              kubernetes.io/metadata.name: agentic-demo
          services:
            matchLabels:
              app: orders-service
      - name: cloudcart-customers
        selector:
          namespaces:
            matchLabels:
              kubernetes.io/metadata.name: agentic-demo
          services:
            matchLabels:
              app: customers-service
      - name: cloudcart-notifications
        selector:
          namespaces:
            matchLabels:
              kubernetes.io/metadata.name: agentic-demo
          services:
            matchLabels:
              app: notifications-service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudcart-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cloudcart/mcp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: cloudcart-mcp
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: cloudcart-mcp-catalog
  namespace: agentgateway-system
spec:
  mcp:
    # Tool names stay as the server defines them. With prefixing on they arrive as
    # `orders-service-8080_getOrderStatus`, which changes every name the agent knows.
    prefixMode: Never
    targets:
      - name: cloudcart-catalog
        selector:
          namespaces:
            matchLabels:
              kubernetes.io/metadata.name: agentic-demo
          services:
            matchLabels:
              app: catalog-service
---
apiVersion: gateway.networking.k8s.io/v1
