apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-ui
  namespace: agentic-demo
  labels:
    app: support-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-ui
  template:
    metadata:
      labels:
        app: support-ui
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: support-ui
          image: ghcr.io/btjimerson/cloud-cart-support-agentic/support-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # No model API key and no MCP server URLs: this pod calls neither.
            # It resolves agents through the catalog and the gateway authorizes the rest.
            - name: AGENTREGISTRY_URL
              value: "http://agentregistry-enterprise-server.agentregistry-system.svc:12121"
            - name: AGENTREGISTRY_RUNTIME
              value: "kagent"
            - name: CONCIERGE_AGENT
              value: "support-concierge"
            - name: AGENTREGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentregistry-token
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: support-ui
  namespace: agentic-demo
spec:
  type: LoadBalancer
  selector:
    app: support-ui
  ports:
    - port: 8080
      targetPort: 8080
