apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-ui
  namespace: agentic-demo
  labels:
    app: support-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-ui
  template:
    metadata:
      labels:
        app: support-ui
    spec:
      containers:
        - name: support-ui
          image: ghcr.io/btjimerson/cloud-cart-support/support-ui:2728dcb
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # No model API key and no MCP server URLs: this pod calls neither.
            # It resolves agents through the catalog and the gateway authorizes the rest.
            - name: AGENTREGISTRY_URL
              value: "http://agentregistry-enterprise-server.agentregistry-system.svc:12121"
            - name: AGENTREGISTRY_RUNTIME
              value: "kagent"
            - name: CONCIERGE_AGENT
              value: "support-concierge"
            # A concierge turn can span an A2A hop plus several MCP tool calls, which the
            # 60s default does not cover: the slowest path (a denied Platinum return, where
            # the agent also reasons about alternatives) timed out and surfaced as "the agent
            # is unavailable".
            - name: AGENTREGISTRY_TIMEOUT_SECONDS
              value: "180"
            # The frontend mints its own short-lived registry tokens rather than carrying a
            # pasted one that would expire mid-demo. Credentials come from a Secret created
            # by k8s/create-support-ui-secret.sh out of .env.local -- they are never committed.
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: support-ui-oidc
                  key: issuer
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: support-ui-oidc
                  key: clientId
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: support-ui-oidc
                  key: clientSecret
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: support-ui
  namespace: agentic-demo
spec:
  type: LoadBalancer
  selector:
    app: support-ui
  ports:
    - port: 8080
      targetPort: 8080
