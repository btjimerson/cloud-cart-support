apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
  namespace: agentic-demo
  labels:
    app: customers-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customers-service
  template:
    metadata:
      labels:
        app: customers-service
    spec:
      containers:
        - name: customers-service
          image: ghcr.io/btjimerson/cloud-cart-support/customers-service:16a8e94
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: agentic-demo
  labels:
    app: customers-service
    # Selected by the gateway's MCP federation backend in k8s/agentgateway/.
    cloudcart.dev/mcp: "true"
spec:
  selector:
    app: customers-service
  ports:
    # appProtocol is how agentgateway recognises this as an MCP backend port. Without it the
    # federation backend resolves to nothing and the gateway answers "no backends configured".
    - port: 8080
      targetPort: 8080
      appProtocol: agentgateway.dev/mcp
